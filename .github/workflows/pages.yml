name: 部署到 GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 构建静态站
        run: python scripts/build.py

      - name: 自检
        run: python scripts/verify.py

      # 注意：Pages 需要在仓库 Settings → Pages 里手动开启一次
      # （Source 选 "GitHub Actions"），GITHUB_TOKEN 没有管理员权限去自动开启
      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 上传 dist 目录
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布
        id: deployment
        uses: actions/deploy-pages@v4
